name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: ruff check src tests
      - run: pytest --cov=mw_cli --cov-report=term-missing --cov-report=xml
      - run: python -m build
  live-mediawiki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki: '1.43.1'
            php: '8.3'
          - mediawiki: '1.45.0'
            php: '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, intl, mbstring, xml, fileinfo
          coverage: none
      - run: python -m pip install -e ".[test]"
      - run: python tests/run_disposable_wiki.py ${{ matrix.mediawiki }}
