[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "griboedow-mw-cli"
version = "0.4.0"
description = "Agent-friendly MediaWiki CLI with files, Semantic MediaWiki and revision-bound guidelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nikolai Kochkin" }]
dependencies = ["click>=8.1,<9", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11", "build>=1.2", "PyYAML>=6"]

[project.scripts]
mw-cli = "mw_cli.cli:main"

[project.urls]
Repository = "https://github.com/Griboedow/mw-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mw_cli"]

[tool.hatch.build.targets.wheel.force-include]
skills = "mw_cli/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: opt-in tests against a disposable MediaWiki"]

[tool.coverage.run]
source = ["mw_cli"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py310"
